body:
  text: 明目專看此珠不下則止下則易珠不下為勝後以夜半守之九九日當有物泳氣海中兆若心動恐悸魂魄飛越可無畏也常以九九為轉是珠為胎化龍寶當飛入天精中宫絳玉之淵又升上清乾元紫玉之淵是謂元池上元瓊胎之府神龍常以夜半負兆身形上游九天又取龍氣以鍊兆形形通無有可以出入龍之口鼻又當念道正知不爾魔攝化為異趣愼之哉待關元有物景狀了了可於江海之際取長鯉長三尺者內升龍符黃書青素安魚口中上清赤鯉升龍之符安符祝曰龍胎赤鯉服兆玄符雷電合發飛奔玉虛舉兆之身次放水中當以歲首雷霆之日伺之若在其所有迅電起則赤鯉為龍上登龍丘之阿兆道成之日神龍來下載兆上升蘂珠之房龍玄寶文青書黃素佩之致精神龍鍊凝瓊胎其道一舉宜宣真人上清神母飛玄寶文白然妙氣上清太淵神龍瓊胎乘景上玄玉章
  hash: sha256:25722f2125a3da2f1440220567e02527cac9e0c8f5ecf1ff932c5160a9bf0f2c
