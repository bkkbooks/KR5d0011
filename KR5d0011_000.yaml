front:
  text: 上清太淵神龍瓊胎乘景上玄玉章汶水真人訪丹元曰我以聖師總真上宰西城王君謁清虛小有天王自汶水迎侍及太極諸真人龍師河伯從之大㑹下元以議度世之偉人碩才進任丹元皇極方諸洞清玄之官啓大洞上清靈藴出上品寶書以授諸至學我當遺君龍珠神藥上玄玉章丹元請其詳真人曰我始授總真上清要道又蒙上清上玄玉女賜我神龍之珠上清神母妙氣之符珥珠則瓊胎特秀龍德自然佩符則水官拜伏河瀆聽命道之奧妙白日飛升我成真時玉胞拆露神龍負形今已出入上清典司淵宅神龍蜿蜓銀光皓質化為修蛇我嘗貯以塗金碧碗俾侍女持之是龍當中秋月滿時凝眸注想光霞交映則口出一珠如彈丸焉我火之成粉作散珠以與清骨無老之民今年得一珠分四十九珠我服其一餘四十八以授於君於是碧玉壺出珠如塗金大小不一如用此則不用玉章中珠世人得書不見我則用玉章中珠也丹元再拜受之又曰君簡宿名當傳書𧵥以金雙魚碧紋之羅君可齎焉丹元以黃金作靈腹魚一雙長五寸半青絲貫魚首尾貼金結綬碧水紋羅四十九尺奉詞𧵥盟經師汶水真人蒙授太淵神龍瓊胎乘景上玄玉章上清升龍玄寶文自然妙氣碧穀雙書符文並朱書蘂一係空處龍君就請不以與之乃錫上淸神金一乘右𢍆授而易之又請紫靈玉元上道君割玉京邃洞碧琳懸腹自然流液致珠七曜交游百寶上器抱洞陽九鍊之光珠成金醴作琥珀給分三十六珠仰盟上清九真二十四皇太上丈人以開度上清十六左真二十雌真左真上首上淸龍德海空寶慧真人是也雌真上首清淵太素元君玉仙聖母是也列為聖師承接真士有得此文龍君奉寶有行其道神龍負月足浮太霄不暮之庭授以金魚一雙碧紋四十九尺不遵玉禁示於臭濁風刀解形灌塞河源役考水官其道治上玉為瑩珠如雀卵盛金罌漬以月華黃水世自有方九日夜取之待向曙東方有明星時東望燒香再拜訖祝曰太淵神寶明月之光鎮兆元宫化成神龍瓊胎內變如意飛浮負兆真形上升長樓咒畢閉氣咽之以意注想入關元中訖
